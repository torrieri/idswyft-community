apiVersion: apps/v1
kind: Deployment
metadata:
  name: idswyft-frontend
  namespace: idswyft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idswyft-frontend
  template:
    metadata:
      labels:
        app: idswyft-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/torrieri/idswyft-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: idswyft-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: idswyft-frontend
  namespace: idswyft
spec:
  selector:
    app: idswyft-frontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
