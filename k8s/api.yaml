apiVersion: apps/v1
kind: Deployment
metadata:
  name: idswyft-api
  namespace: idswyft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idswyft-api
  template:
    metadata:
      labels:
        app: idswyft-api
    spec:
      initContainers:
        - name: fetch-migrations
          image: alpine/git
          command:
            - /bin/sh
            - -c
            - |
              git clone https://github.com/torrieri/idswyft-community.git /tmp/repo
              cp -r /tmp/repo/supabase/migrations/* /migrations/
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: api
          image: ghcr.io/torrieri/idswyft-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: idswyft-db-app
                  key: uri
            - name: DATABASE_SSL
              value: "false"
            - name: ENGINE_URL
              value: "http://idswyft-engine:3002"
            - name: CORS_ORIGINS
              value: "http://idswyft.tk.hv.orkapi.net,https://idswyft.tk.hv.orkapi.net"
            - name: FRONTEND_URL
              value: "https://idswyft.tk.hv.orkapi.net"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: SANDBOX_MODE
              value: "true"
            - name: MIGRATIONS_LENIENT
              value: "true"
            - name: STORAGE_PROVIDER
              value: "s3"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_S3_BUCKET
              value: "orkapi-idswyft"
          envFrom:
            - secretRef:
                name: idswyft-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1.0"
              memory: 1Gi
          volumeMounts:
            - name: migrations
              mountPath: /app/backend/migrations
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: migrations
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: idswyft-api
  namespace: idswyft
spec:
  selector:
    app: idswyft-api
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
