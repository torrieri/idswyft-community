apiVersion: apps/v1
kind: Deployment
metadata:
  name: idswyft-engine
  namespace: idswyft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idswyft-engine
  template:
    metadata:
      labels:
        app: idswyft-engine
    spec:
      containers:
        - name: engine
          image: ghcr.io/torrieri/idswyft-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2.0"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: idswyft-engine
  namespace: idswyft
spec:
  selector:
    app: idswyft-engine
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
