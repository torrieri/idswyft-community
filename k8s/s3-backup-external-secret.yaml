apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: s3-backup-credentials
  namespace: idswyft
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: s3-backup-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: orkapi/cnpg/s3-backup
